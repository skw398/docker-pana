name: Publish image
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: metadata
        name: Set image identity
        shell: sh
        run: |
          set -eu
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: docker-pana:candidate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyze Dart fixture
        uses: ./
        with:
          path: test/fixtures/sample_package
          image: docker-pana:candidate
      - name: Analyze Flutter fixture
        uses: ./
        with:
          path: test/fixtures/flutter_package
          image: docker-pana:candidate
      - name: Verify score sections
        shell: sh
        run: sh test/verify_scores.sh docker-pana:candidate partial_score_package
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        shell: sh
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          docker tag docker-pana:candidate "$IMAGE:$TAG"
          docker tag docker-pana:candidate "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
